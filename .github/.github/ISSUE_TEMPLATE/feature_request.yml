name: 💡 Feature Request
description: Suggest an idea or new feature for Xtify
title: "[Feature]: "
labels: ["enhancement", "feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new idea for Xtify! Please fill out the details below to help us understand what you'd like to see.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the issue is. (e.g., "I'm always frustrated when...")
      placeholder: e.g., I love keeping playlists offline, but there's currently no easy way to manage or clean up downloaded songs that I no longer listen to.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: e.g., Add a storage management view under Downloads that lets users sort files by size or last played, with a quick-delete option.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative features or workarounds you've considered.
      placeholder: e.g., Manually deleting individual files through a file manager app.
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Is this feature specific to a certain platform?
      options:
        - Both Android & Windows
        - Android Only
        - Windows Only
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any mockups, screenshots, or extra context about the feature request here.
      placeholder: Mockups, design inspirations, or related music player features.
    validations:
      required: false
