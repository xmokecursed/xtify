name: 🐛 Bug Report
description: File a bug or unexpected behavior for Xtify
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below so we can fix it.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: e.g., Songs stop playing automatically after 5 tracks when backgrounded.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: List the steps clearly so we can replicate the issue.
      placeholder: |
        1. Open Xtify and search for 'Song Name'
        2. Tap the first result
        3. Lock the screen
        4. Observe the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: e.g., The next song in the auto-queue should play seamlessly.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform are you using Xtify on?
      options:
        - Android
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS Version / Device Model
      description: e.g., Android 14 / Google Pixel 7, or Windows 11 Pro
      placeholder: e.g., Android 13 / Samsung Galaxy S21
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: Xtify Version
      description: Found in app settings or the version you downloaded.
      placeholder: e.g., v1.2.0
    validations:
      required: true
  - type: checkboxes
    id: youtube_signin
    attributes:
      label: YouTube Sign-In Status
      description: Are you signed in to YouTube inside the app?
      options:
        - label: Yes, I am currently signed in
          required: false
        - label: No, using it unsigned
          required: false
  - type: textarea
    id: debug_info
    attributes:
      label: Debug Info
      description: |
        As mentioned in the README, please go to **Library → bug icon → Copy debug info** and paste it here!
      placeholder: Paste debug logs/info here...
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Videos
      description: If applicable, add screenshots or screen recordings to help explain.
      placeholder: Drag and drop screenshots here
    validations:
      required: false
