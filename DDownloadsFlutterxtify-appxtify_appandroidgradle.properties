
# Disable Gradle instrumentation to avoid deserialization issues
android.experimental.disableIntrospection=true
kotlin.daemon.jvm.options=-Xmx2g
org.gradle.parallel=true
org.gradle.configureondemand=true
# Additional flags to disable problematic instrumentation
org.gradle.unsafe.configuration-cache=false
org.gradle.vfs.watch=false
org.gradle.unsafe.watch-fs=false

# Disable all forms of Gradle instrumentation and caching that might cause deserialization issues
org.gradle.unsafe.configuration-cache=false
org.gradle.configuration-cache=false
org.gradle.parallel=false
org.gradle.configureondemand=false
org.gradle.vfs.watch=false
org.gradle.unsafe.watch-fs=false
android.experimental.disableIntrospection=true
kotlin.parallel.builds.in.project=false
kotlin.incremental=false
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dorg.gradle.unsafe.configuration-cache=false -Dorg.gradle.configuration-cache=false
